    - Последовательно кликнуть по всем фотографиям в карточке подробного описания товара
    - Кликнуть на кнопку «Store»
  expected-result: |
    Пользователь должен попасть на карточку с подробным описанием выбранного товара, при клике на фотографии в карточке фотография отображается в увеличенном размере, 
    при клике на кнопку «Store» пользователь возвращается обратно в список товаров.

