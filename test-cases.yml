- summary: | 
    Проверка возможность добавления в один заказ нескольких экземпляров одного товара
  requirement: |
    Должна быть обеспечена возможность добавления в один заказ нескольких экземпляров одного товара
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров, товар "Essence Mascara Lash Princess"
  steps:
    - В списке товаров выбрать "Essence Mascara Lash Princess"
    - Щелкнуть по кнопке "Add to cart"
    - Щелкнуть по кнопке "Cart"
    - Щелкнуть по количеству товаров в строке с товаром "Essence Mascara Lash Princess"
    - Ввести значение "4" в открывшемся модальном окне
    - Нажать кнопку "Save"
  expected-result: |
    В карточке заказа товаров корректно отображается информация о количестве единиц товара, общая цена заказа пересчитывается корректно 

- summary: | 
    Проверка автоматического обновления информации о товарах доступных для заказа 
  requirement: |
    Должно быть обеспечено автоматическое обновление информации о товарах, доступных для заказа
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров, товар "Essence Mascara Lash Princess"
  steps:
    - В списке товаров выбрать "Essence Mascara Lash Princess", запомнить "Количество товаров, доступных для заказа № 1"
    - Щелкнуть по кнопке "Add to cart"
    - Щелкнуть по кнопке "Checkout"
    - В списке товаров найти "Essence Mascara Lash Princess", посмотреть на "Количество товаров, доступных для заказа № 2"
  expected-result: |
    При оформлении заказа, доступное для заказа количество единиц товара в списке товаров уменьшается на соответствующее количество единиц, 
    "Количество товаров, доступных для заказа № 1" > "Количество товаров, доступных для заказа № 2", 
    в случае, если "Количество товаров, доступных для заказа № 1" = все доступные для заказа на момент теста единицы товара, 
    товар "Essence Mascara Lash Princess" в списке товаров не отображается   
    
