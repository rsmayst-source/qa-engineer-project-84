- summary: |
    Проверка возможности формирования заказа товаров, помещенных в корзину
  requirement: |
    Должна быть обеспечена возможность формирования из товаров, помещенных в корзину, карточки заказа
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Логин = user Пароль = usertest
  steps:
    - Щелкнуть по кнопке с изображением человека в правом верхнем углу страницы
    - Щелкнуть по кнопке "Войти"
    - Заполнить поля "Логин", "Пароль" тестовыми данными
    - Нажать кнопку "Войти"
    - В списке товаров выбрать "Essence Mascara Lash Princess"
    - Щелкнуть по кнопке "Добавить в корзину"
    - Щелкнуть по кнопке "Заказать"
  expected-result: |
    Из товаров, помещенных в корзину, создана карточка заказа

- summary: |
    Проверка возможности формирования оплаты карточки заказа товаров
  requirement: |
    Должна быть обеспечена возможность оплаты карточки заказа товаров
  prerequisites:
    Открыта страница со списком товаров интернет-магазина, в корзине сформирована карточка заказа товаров, в карточке 1 товар "Essence Mascara Lash Princess" 
  test-data: |
    Логин = user Пароль = usertest
    Номер карты = 4276 1057 5725 6223 Дата истечения срока действия = 12/2034 Проверочный код на обратной стороне = 950 
  steps:
    - Щелкнуть по кнопке с изображением человека в правом верхнем углу страницы
    - Щелкнуть по кнопке "Войти"
    - Заполнить поля "Логин", "Пароль" тестовыми данными
    - Нажать кнопку "Войти"
    - Щелкнуть по кнопке "Корзина"
    - Щелкнуть по карточке заказа товаров, в которой указан 1 товар "Essence Mascara Lash Princess"
    - Щелкнуть по кнопке "Оплатить"
    - В открывшейся карточке оплаты товаров заполнить поля "Номер карты", "Дата истечения срока действия", "Проверочный код на обратной стороне" тестовыми данными  
  expected-result: |
    Получено подтверждение от сайта об успешной оплате товаров
    
- summary: |
    Проверка хранения истории заказов и просмотр информации о заказах
  requirement: |
    Должно быть обеспечено хранение истории заказов и просмотр информации о заказах
