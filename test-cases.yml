---
- summary: | 
    Проверка возможности поиска товаров по ключевому слову
  requirement: |
    При вводе пользователем в поисковое поле ключевого слова должны отображаться только товары, в названии которых встречается ключевое поле 
  prerequisites: |
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Ключевое слово = "Apple Airpods"
  steps:
    - В поисковое поле вводим "Apple Airpods"
  expected-result: |
    Должны отобразиться товары в названии которых встречается "Apple Airpods"
    
- summary: | 
    Проверка возможности поиска товаров по названию категории
  requirement: |
    При вводе пользователем в поисковое поле названия категории должны отображаться только товары, относящиеся к заданной категории 
  prerequisites: |
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Название категории = "beauty"
  steps:
    - В поисковое поле вводим "beauty"
  expected-result: |
    Должны отобразиться только товары, относящиеся к категории "beauty"
    
- summary: |
    Проверка возможности фильтрации товаров пользователем
  requirement: |
    При выставлении пользователем фильтров должны отображаться только товары, соответствующие заданным фильтрам
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Фильтры: "Category" = "beauty", "Brand" = "Nail Couture"
  steps:
    - В "Category" выбираем "beauty" "Brand" = "Nail Couture"
    - В "Brand" выбираем "Nail Couture"
  expected-result: |
    Должны отображаться только товары, соответствующие категории товаров "beauty", выпущенные брендом "Nail Couture"

- summary: |
    Проверка возможности просмотра товаров и информации о них пользователем 
  requirement: |
    Пользователь должен иметь возможность просматривать список товаров и иметь возможность перейти к карточке с подробным описанием выбранного товара
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров, товар "Huawei Matebook X Pro"
  steps:
    - Прокрутить список товаров до низу
    - Перейти на следующую страницу списка товаров
    - Прокрутить список товаров до низу
    - Перейти на следующую страницу списка товаров
    - В списке товаров найти "Huawei Matebook X Pro", кликнуть по нему
  expected-result: |
    Пользователь должен попасть на карточку с подробным описанием выбранного товара

- summary: |
    Проверка возможности добавления товаров в корзину пользователем 
  requirement: |
    Пользователь должен иметь возможность добавления выбранного товара в корзину
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Товар "Powder Canister"
  steps:
    - В списке товаров найти "Powder Canister"
    - Нажимаем кнопку "Add to cart"
  expected-result: |
    Выбранный товар должен добавиться в корзину

- summary: |
    Проверка возможности переключения языка интерфейса 
  requirement: |
    Пользователь должен иметь возможность переключить язык на главной странице сайта
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров
  steps:
    - На главной странице сайта нажать на кнопку "Language", выбрать значение "Russian"
    - На главной странице сайта нажать на кнопку "Язык", выбрать значение "Английский"
  expected-result: |
    Кнопка "Language" сменила название на "Язык", функциональность выбора языка сохранена 
  
- summary: |
    Проверка наличия локализации сайта на русском и английском языке 
  requirement: |
    Информация на сайте должна отображаться на выбранном пользователем языке
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров
  steps:
    - На главной странице сайта нажать на кнопку "Language", выбрать значение "Russian"
    - На главной странице сайта нажать на кнопку "Язык", выбрать значение "Английский"
  expected-result: |
    Названия товаров (за исключением наименований брендов), описание товаров, все управляющие кнопки должны отобразиться на выбранном языке - по-умолчанию на английском, при выборе значения "Russian" под кнопкой "Language" - на русском, при выборе значения "Английский" под кнопкой "Язык" - снова на английском

- summary: |
    Проверка оптимизации работы сайта при низкой скорости интернет-соединения
  requirement: |
    При низкой скорости интернет-соединения загрузка сайта должна осуществляться поэтапно - сначала общая структура сайта, потом карточки товаров, изображения товаров загружаются в последнюю очередь
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров
  steps:
    - Открыть "DevTools"
    - Перейти на вкладку "Network"
    - Установить скорость соединения "3G"
    - Перезагрузить страницу
  expected-result: |
    Загрузка сайта должна осуществиться поэтапно - сначала должна загрузиться общая структура сайта, потом должны загрузиться карточки товаров, изображения товаров должны загрузиться в последнюю очередь

- summary: |
    Проверка использования сайтом протокола передачи данных HTTPS 
  requirement: |
    Сайт должен использовать протокол передачи данных HTTPS 
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров
  steps:
    - Щелкнуть по адресной строке, просмотреть вид протокола передачи данных
    - Открыть "DevTools"
    - Перейти на вкладку "Security"
  expected-result: |
    В адресной строке перед адресом сайта указан протокол передачи данных HTTPS, в "Security overview" на вкладке "Security" содержится текст "This page is secure (valid HTTPS)."
    
- summary: |
    Проверка наличия у сайта мобильной версии
  requirement: |
    При входе на сайт с мобильного устройства сайт должен отображаться в мобильной версии
  prerequisites:
    На мобильном устройстве открыт браузер
  test-data: |
    Сайт = https://products-store.hexlet.app/
  steps:
    - Перейти по ссылке https://products-store.hexlet.app/
  expected-result: |
    Должна открыться мобильная версия сайта, дизайн и содержание оптимизированы под просмотр с мобильных устройств

- summary: |
    Проверка корректности работы сайта в последних версиях разных браузеров
  requirement: |
    Сайт должен корректно работать в последних версиях разных браузеров
  prerequisites:
    Открыт сайт https://www.browserstack.com/
  test-data: |
    Сайт = https://products-store.hexlet.app/
  steps:
    - Выбрать вид тестирования "Web Testing" - "Live"
    - В поисковую строку ввести адрес сайта "https://products-store.hexlet.app/" и нажать кнопку "Start test"
    - Последовательно открыть сайт "https://products-store.hexlet.app/" через "https://www.browserstack.com/" в последних версиях всех доступных браузеров.
  expected-result: |
    Во всех протестированных браузерах сайт отобразился корректно  

- summary: |
    Проверка корректности работы сайта на различных устройствах
  requirement: |
    Сайт должен корректно работать на различных устройствах
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров
  steps:
    - Открыть "DevTools"
    - Щелкнуть по "Toggle device toolbar"
    - Последовательно проверить корректность работы сайта на основных моделях мобильных устройств и типовых разрешениях экранов 
  expected-result: |
    На всех проверенных моделях мобильных устройств и типовых разрешениях экранов сайт отображается корректно

- summary: |
    Проверка доступности сайта из сети Интернет без использования VPN
  requirement: |
    Сайт должен быть доступен из сети Интернет (открываться без использования VPN)
  prerequisites:
    На компьютере открыт браузер
  test-data: |
    Сайт = https://products-store.hexlet.app/
  steps:
    - Проверить, что компьютер, с которого проводится тестирование, не использует VPN
    - Перейти по ссылке "https://products-store.hexlet.app/"
  expected-result: |
    Сайт открылся из сети Интернет без использования VPN, функиональность не нарушена
  
- summary: |
    Проверка наличия и работоспособности формы регистрации пользователей
  requirement: |
    На сайте должна быть размещена форма регистрации пользователей 
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Логин = user Пароль = usertest Повторите пароль = usertest Телефон = +79817841576
  steps:
    - Щелкнуть по кнопке с изображением человека в правом верхнем углу страницы
    - Щелкнуть по кнопке "Регистрация"
    - Заполнить поля "Логин", "Пароль", "Повторите пароль", "Телефон" тестовыми данными
    - Нажать кнопку "Зарегистрироваться"
  expected-result: |
    Получено подтверждение от сайта о регистрации нового пользователя

