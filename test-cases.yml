- summary: | 
    Проверка возможности перелистывания страниц со списком товаров 
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites:
    Открыта страница со списком товаров интернет-магазина
  test-data: |
    Список товаров
  steps:
    - Прокрутить список товаров до низу
    - Перейти на следующую страницу списка товаров
    - Прокрутить список товаров до низу
    - Перейти на следующую страницу списка товаров
    - Перейти на предыдущую страницу
    - Перейти на предыдущую страницу
  expected-result: |
    Прокрутка списка товаров до управляющих кнопок «Next» и «Previous» осуществляется, список товаров обновляется при нажатии на управляющую кнопку, верстка сайта сохраняется. 
    При долистывании пользователем до последней страницы кнопка «Next» становится неактивной, раскрашивается серым цветом. 
    Кнопка «Previous» при нахождении пользователя на первой странице списка товаров окрашена серым цветом.

- summary: | 
    Проверка возможности просмотра товаров и информации о них пользователем 
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
