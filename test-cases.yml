  test-data: |
    Логин = user Пароль = usertest 
  steps:
    - Щелкнуть по кнопке с изображением человека в правом верхнем углу страницы
    - Щелкнуть по кнопке "Войти"
    - Заполнить поля "Логин", "Пароль" тестовыми данными
    - Нажать кнопку "Войти"
    - Щелкнуть по кнопке "Профиль"
    - Щелкнуть по строке "Мои заказы"
    - Щелкнуть по карточке заказа товаров, в которой указан 1 товар "Essence Mascara Lash Princess"  
  expected-result: |
    Открылась карточка заказа, содержащая информацию о номере заказа, дате заказа, количестве заказанных товаров, наименовании заказанных товаров, цене каждого из заказанных товаров, общей цене заказа, статусе оплаты заказа, дате доставки заказа 
  
   _________Должни заказа быть обеспечено автоматическое обновление информации о товарах, доступных для заказа
