- summary: |
    Отсутствует возможность добавления из корзины в один заказ нескольких экземпляров одного товара
  environment: |
    Яндекс.Браузер 26.8.2.1064 (64-bit)
    ОС Windows 11 Pro
  steps-to-reproduce: |
    1. Зайти на сайт по ссылке https://products-store.hexlet.app/
    2. В списке товаров выбрать "Essence Mascara Lash Princess"
    3. Щелкнуть по кнопке "Add to cart"
    4. Щелкнуть по кнопке "Cart"
    5. Щелкнуть по количеству товаров в строке с товаром "Essence Mascara Lash Princess"
  expected-result: |
    Должно открыться модальное окно, в котором возможно изменить количество товаров, добавляемых в заказ 
  actual-result: |
    Модальное окно не открывается, осуществляется переход к карточке подробного описания товаров 
    Ошибка изображена на скриншоте:
    https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Корзина%20с%20одним%20товаром.jpeg

- summary: |
    Информация о количестве единиц товаров, доступных для заказа, не обновляется на сайте в списке товаров
  environment: |
    Яндекс.Браузер 26.8.2.1064 (64-bit)
    ОС Windows 11 Pro
  steps-to-reproduce: |
    1. Зайти на сайт по ссылке https://products-store.hexlet.app/
    2. В списке товаров выбрать "Essence Mascara Lash Princess", запомнить "Количество товаров, доступных для заказа № 1"
    3. Щелкнуть по кнопке "Add to cart"
    4. Щелкнуть по кнопке "Checkout"
    5. В списке товаров найти "Essence Mascara Lash Princess", посмотреть на "Количество товаров, доступных для заказа № 2"
  expected-result: |
    Доступное для заказа количество единиц товара в списке товаров должно уменьшается на "Количество товаров, доступных для заказа № 1", 
    в случае, если "Количество товаров, доступных для заказа № 1" = все доступные для заказа на момент теста единицы товара, товар "Essence Mascara Lash Princess" в списке товаров не отображается   
  actual-result: |
    Пересчет количества единиц товаров, доступных для заказа, не осуществляется 
    Путь к ошибке изображен на скриншотах:
