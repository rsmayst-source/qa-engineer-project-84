---
- summary: |
    Некорректно отображается фильтр по цене в мобильной версии браузера
  environment: |
    Google Chrome 153.0.8010.36
    ОС Android 15
  steps-to-reproduce: |
    1. Зайти на сайт по ссылке https://products-store.hexlet.app/
  expected-result: |
    Должна открыться мобильная версия сайта, дизайн и содержание оптимизированы под просмотр с мобильных устройств
  actual-result: |
     Фильтр по цене в мобильной версии браузера отображается некорректно - не видны введенные в него значения
     СКРИНШОТ

- summary: |
    Некорректно отображается фильтр по цене в мобильной версии браузера
  environment: |
    Яндекс.Браузер 26.8.2.1064 (64-bit)
    ОС Windows 11 Pro
  steps-to-reproduce: |
    1. Зайти на страницу логина https://runit.hexlet.ru/login
    2. Нажать ссылку «Не помню пароль»
    3. Ввести почту и нажать «Восстановить пароль»
  expected-result: |
    На странице формы будет сообщение с просьбой проверить почту
    На почту придет письмо со ссылкой на восстановление пароля
  actual-result: |
    На странице ничего не происходит
    В консоли браузера в Devtools выводится почта

