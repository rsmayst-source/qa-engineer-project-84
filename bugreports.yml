- summary: |
    Сайт не открывается в браузерах IE 11 и Safari 5.1 на устройстве с Windows 10 
  environment: |
    Яндекс.Браузер 26.8.2.1064 (64-bit)
    ОС Windows 11 Pro
    Браузеры IE 11 и Safari 5.1, запущенные через https://www.browserstack.com/
  steps-to-reproduce: |
    1. Зайти на сайт по ссылке https://www.browserstack.com/
    2. Выбрать вид тестирования "Web Testing" - "Live"
    3. В поисковую строку ввести адрес сайта "https://products-store.hexlet.app/" и нажать кнопку "Start test"
    4. Выбрать браузер IE 11, устройство с Windows 10 выбрано по умолчанию
    5. Нажать на кнопку "Switch Browser"
    6. Выбрать браузер Safari 5.1
  expected-result: |
    В браузерах IE 11 и Safari 5.1, запущенных через https://www.browserstack.com/, сайт отобразился корректно
  actual-result: |
    Сайт не открывается
    Ошибка изображена на скриншотах:
    https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/IE%2011.jpeg
    https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Safari%205.1.jpeg
    
- summary: |
    Экран, отображаемый пользователю при низкой скорости интернет-соединения, не информативен 
  environment: |
    Яндекс.Браузер 26.8.2.1064 (64-bit)
    ОС Windows 11 Pro
  steps-to-reproduce: |
    1. Зайти на сайт по ссылке https://products-store.hexlet.app/
    2. Открыть "DevTools"
    3. Перейти на вкладку "Network"
    4. Установить скорость соединения "3G"
    5. Перезагрузить страницу
  expected-result: |
    Загрузка сайта должна осуществиться поэтапно - сначала должна загрузиться общая структура сайта, потом должны загрузиться карточки товаров, изображения товаров должны загрузиться в последнюю очередь. 
    При долгом отклике от сервера пользователю должно отображаться сообщение, в явном виде указывающее на необходимость дождаться загрузки сайта.
  actual-result: |
    Пользователю отображается экран, не содержащий полезной информации о необходимости дождаться загрузки сайта
    Ошибка изображена на скриншоте:
    https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Экран%20на%20медленной%20загрузке.jpeg

