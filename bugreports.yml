- summary: |
    Кнопки «Next» и «Previous» не окрашиваются серым цветом
  environment: |
    Яндекс.Браузер 26.8.2.1064 (64-bit)
    ОС Windows 11 Pro
  steps-to-reproduce: |
    1. Зайти на сайт по ссылке https://products-store.hexlet.app/
    2. Прокрутить список товаров до низу
    3. Перейти на следующую страницу списка товаров
    4. Прокрутить список товаров до низу
    5. Перейти на следующую страницу списка товаров
    6. Перейти на предыдущую страницу
    7. Перейти на предыдущую страницу
  expected-result: |
    При долистывании пользователем до последней страницы кнопка «Next» становится неактивной, раскрашивается серым цветом. 
    Кнопка «Previous» при нахождении пользователя на первой странице списка товаров окрашена серым цветом.
  actual-result: |
    Кнопки «Next» и «Previous» не окрашиваются серым цветом («Next» - при долистывании пользователем до последней страницы списка товаров, «Previous» - при нахождении пользователя на первой странице списка товаров)
    Ошибка изображена на скриншоте:
    https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Кнопка%20не%20подсвечивается.jpeg

