    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В списке товаров выбрать "Essence Mascara Lash Princess"
      3. Щелкнуть по кнопке "Ad to cart"
      4. Щелкнуть по кнопке "Checkout"
    expected-result: |
      В модальном окне с подтверждением успешности создания заказа должна быть кнопка "Pay", по клику на которой осуществляется переход к форме оплаты заказа   
    actual-result: |
      Кнопка "Pay" отсутствует
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Форма%20оплаты.jpeg

  - summary: |
      Не осуществляется переход к истории заказов
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
    expected-result: |
      В правом верхнем углу должна быть иконка "My orders", по клику на которую осуществляется переход к истории заказов  
    actual-result: |
      Иконка "My orders" отсутствует
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Нет%20блока%20Мои%20заказы.jpeg

  - summary: |
      Язык описания товаров не меняется в зависимости от выбранного языка 
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. Щелкнуть по кнопке "Language", выбрать значение "Russian"
      3. Щелкнуть по кнопке "Язык", выбрать значение "Английский"
    expected-result: |
      Названия товаров (за исключением наименований брендов), описание товаров, все управляющие кнопки должны отобразиться на выбранном языке (при выборе значения "Russian" - на русском, при выборе значения "Английский" - на английском)  
    actual-result: |
      Описание товаров отображается всегда на английском языке
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Описание%20на%20английском%20магазин%20на%20русском.jpeg

  - summary: |
      Цена не пересчитывается в зависимости от настроек языка 
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. Щелкнуть по кнопке "Language", выбрать значение "Russian"
      3. Щелкнуть по кнопке "Язык", выбрать значение "Английский"
    expected-result: |
      Цена и валюта товаров отображаются в соответствии с выбранным языком (при выборе значения "Russian"  - в рублях, при выборе значения "Английский" - в фунтах)  
    actual-result: |
      Валюта товаров отображаются всегда в долларах, цена не пересчитывается при переключении языка  
      Ошибка изображена на скриншотах:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Доллар%20-%20магазин%20на%20английском.jpeg
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Доллар%20-%20магазин%20на%20русском.jpeg
