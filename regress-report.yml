  - summary: |
      Отсутствует возможность поиска товаров по названию категории
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В поисковое поле ввести "beauty"
    expected-result: |
      Должны отобразиться только товары, относящиеся к категории "beauty"
    actual-result: |
      Список товаров, соответствующих критериям, пуст 
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Некорректный%20поиск%20по%20категории.jpeg

  - summary: |
      Фильтр по бренду на второй странице списка товаров отсутствует
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. Прокрутить список товаров до низу
      3. Перейти на следующую страницу списка товаров
      4. Прокрутить список товаров до низу
      5. Перейти на следующую страницу списка товаров
      6. Перейти на предыдущую страницу
      7. Перейти на предыдущую страницу
    expected-result: |
      При перелистывании пользователем страниц списка товаров возможность фильтрации товаров сохраняется 
    actual-result: |
      При переходе пользователя на вторую страницу списка товаров возможность фильтрации пропадает, с третьей страницы снова возвращается
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Нет%20фильтра%20на%202%20странице.jpeg

  - summary: |
      Отсутствует возможность добавления из корзины в один заказ нескольких экземпляров одного товара
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В списке товаров выбрать "Essence Mascara Lash Princess"
      3. Щелкнуть по кнопке "Add to cart"
      4. Щелкнуть по кнопке "Cart"
      5. Щелкнуть по количеству товаров в строке с товаром "Essence Mascara Lash Princess"
    expected-result: |
      Должно открыться модальное окно, в котором возможно изменить количество товаров, добавляемых в заказ 
    actual-result: |
      Модальное окно не открывается, осуществляется переход к карточке подробного описания товаров 
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Несколько%20экземпляров.jpeg

  - summary: |
      Информация о количестве единиц товаров, доступных для заказа, не обновляется на сайте в списке товаров
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В списке товаров выбрать "Essence Mascara Lash Princess", запомнить "Количество товаров, доступных для заказа № 1"
      3. Щелкнуть по кнопке "Add to cart"
      4. Щелкнуть по кнопке "Checkout"
      5. В списке товаров найти "Essence Mascara Lash Princess", посмотреть на "Количество товаров, доступных для заказа № 2"
    expected-result: |
      Доступное для заказа количество единиц товара в списке товаров должно уменьшается на "Количество товаров, доступных для заказа № 1", 
      в случае, если "Количество товаров, доступных для заказа № 1" = все доступные для заказа на момент теста единицы товара, товар "Essence Mascara Lash Princess" в списке товаров не отображается   
    actual-result: |
      Пересчет количества единиц товаров, доступных для заказа, не осуществляется 
      Путь к ошибке изображен на скриншотах:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Шаг%201%20-%20товары%20в%20списке.jpeg
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Шаг%202%20-%20корзина%20с%20товаром%20из%20списка.jpeg
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Шаг%203%20-%20заказали%20товар.jpeg
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Шаг%204%20-%20вернулись%20в%20магазин%20товаров.jpeg

  - summary: |
      В DevTools отображается ошибка 500 при попытке оформления заказа
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В списке товаров выбрать "Essence Mascara Lash Princess"
      3. Щелкнуть по кнопке "Add to cart"
      4. Щелкнуть по кнопке "Checkout"
    expected-result: |
      Информация о заказе передана на сервер и корректно обработана им. Из товаров, помещенных в корзину, создана карточка заказа  
    actual-result: |
      В DevTools отображается ошибка 500 при попытке оформления заказа 
      Ошибка изображена на скриншоте:
      https://github.com/rsmayst-source/qa-engineer-project-84/blob/main/Ошибка%20500%20при%20заказе.jpeg

  - summary: |
      Не осуществляется переход к форме оплаты заказа
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
