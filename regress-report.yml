bugreports:
  - summary: |
      Некорректно работает фильтр по цене при больших значениях
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В "Price: From" указать "3000"
    expected-result: |
      Должно отобразиться текстовое сообщение "Nothing found!", указывающее на то, что товары с ценой выше 3000 долларов не найден
    actual-result: |
      В результатах поиска отображаются все товары
      Ошибка изображена на скриншоте:
      ////ВСТАВИТЬ СКРИНШОТ////
      
  - summary: |
      Некорректно работает поиск несуществующего товара
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. В поисковое поле ввести "Green Socks"
    expected-result: |
      Должно отобразиться текстовое сообщение "Nothing found!", указывающее на то, что товар с названием "Green Socks" не найден
    actual-result: |
      В результатах поиска отображаются все товары
      Ошибка изображена на скриншоте:
      ////ВСТАВИТЬ СКРИНШОТ////

  - summary: |
      Некорректно работает поиск товара, отсутствующего в наличии
    environment: |
      Яндекс.Браузер 26.8.2.1064 (64-bit)
      ОС Windows 11 Pro
    steps-to-reproduce: |
      1. Зайти на сайт по ссылке https://products-store.hexlet.app/
      2. Пересчитать количество наименований товара, в том числе на последующих страницах каталога
      3. Снять галочку с фильтра "In Stock"
      4. Пересчитать количество наименований товара, в том числе на последующих страницах каталога
    expected-result: |
      Количество наименований товара, отображаемых при снятой галочки с фильтра "In Stock", больше количества наименований товара в наличии; все товары, отображаемые в катологе с проставленной галочкой на фильтре "In Stock" также отображаются при снятой с фильтра "In Stock" галочки
    actual-result: |
      В результатах поиска отображаются только товары с первой страницы каталога
      Ошибка изображена на скриншоте:
      ////ВСТАВИТЬ СКРИНШОТ////
